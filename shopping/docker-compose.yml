services:
  api:
    container_name: c-shopping
    build: .
    ports:
      - "8004:8004"
    environment:
      PORT: 8004
      DB_URL: mongodb://shopping-db:27017/shopping
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - shopping-db

  shopping-db:
    container_name: c-shopping-db
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - shopping-data:/data/db

volumes:
  shopping-data: