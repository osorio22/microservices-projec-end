services:
  customer:
    container_name: c-customers
    build: .
    ports:
      - "8003:8003"
    environment:
      PORT: 8003
      DB_URL: mongodb://customers-db:27017/customers
      APP_SECRET: dev-secret-change-me
      PRODUCTS_URL: http://host.docker.internal:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - customers-db


  customers-db:
    container_name: c-customers-db
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - customers-data:/data/db

volumes:
  customers-data:
